<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Comentarios - SneakerShop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="main.css">
    <style>
        .oculto {
            display: none;
        }
        body {
            background: linear-gradient(135deg, #0c0636 0%, #1a1a2e 100%);
            color: #c5dfe0;
            min-height: 100vh;
        }
        .navbar.is-warning {
            background-color: #1ab188;
        }
        .navbar.is-warning .navbar-burger,
        .navbar.is-warning a.navbar-item {
            color: white;
        }
        .navbar.is-warning a.navbar-item:hover {
            background-color: #148f6e;
            color: white;
        }
        .section {
            background: transparent;
            padding: 0.05rem 0.05rem;
        }
        .comment-form {
            background: linear-gradient(135deg, #24333b 0%, #2a3f47 100%);
            padding: 2.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-left: 4px solid #1ab188;
        }
        .comments-table {
            margin-top: 0.5rem;
            margin-bottom: 2rem;
        }
        .table {
            background-color: #24333b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 0;
        }
        .table thead {
            background-color: #1ab188;
            color: white;
        }
        .table tbody tr {
            background-color: #24333b;
            color: #c5dfe0;
            border-color: #2a3f47;
        }
        .table tbody tr:hover {
            background-color: #2a3f47;
        }
        .table tbody td {
            color: #c5dfe0 !important;
            background-color: #24333b !important;
        }
        .title {
            color: #c5dfe0;
            font-weight: 700;
        }
        .label {
            color: #a0b3b0;
            font-weight: 600;
        }
        textarea.textarea {
            min-height: 100px;
            resize: vertical;
            background-color: #1a2a2f;
            color: #c5dfe0;
            border-color: #1ab188;
        }
        textarea.textarea:focus {
            border-color: #1ab188;
            box-shadow: 0 0 0 0.125em rgba(26, 177, 136, 0.25);
            background-color: #1a2a2f;
            color: #c5dfe0;
        }
        .input {
            background-color: #1a2a2f;
            color: #c5dfe0;
            border-color: #1ab188;
        }
        .input:focus {
            border-color: #1ab188;
            box-shadow: 0 0 0 0.125em rgba(26, 177, 136, 0.25);
            background-color: #1a2a2f;
            color: #c5dfe0;
        }
        .button {
            background-color: #1ab188;
            color: white;
            border: none;
            font-weight: 600;
        }
        .button:hover {
            background-color: #148f6e;
            color: white;
        }
    </style>
    <script>
        var myHeaders = new Headers();
        var csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        myHeaders.append("X-CSRFToken", csrfToken);
        myHeaders.append("Content-Type", "application/json");
        
        document.addEventListener('DOMContentLoaded', () => {
            // Funcionalidad del navbar
            const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
            $navbarBurgers.forEach( el => {
                el.addEventListener('click', () => {
                    const target = el.dataset.target;
                    const $target = document.getElementById(target);
                    el.classList.toggle('is-active');
                    $target.classList.toggle('is-active');
                });
            });
            
            // Mostrar usuario
            mostrarUsuario();
            
            // Cargar comentarios
            pedirComentarios();
        });
        
        function mostrarUsuario() {
            let usuario = localStorage.getItem('usuario');
            if (usuario) {
                document.getElementById('user-navbar').textContent = usuario;
            } else {
                document.getElementById('user-navbar').textContent = 'Usuario no logueado';
            }
        }
        
        function cerrarSesion() {
            localStorage.removeItem('usuario');
            location.href = 'index.html';
        }
        
        function guardarComentario() {
            var raw = JSON.stringify({
                "usuario": document.getElementById("usuario").value,
                "descripcion": document.getElementById("descripcion").value
            });

            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw
            };

            fetch("/api/comentarios/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK"){
                        alert(`Comentario almacenado correctamente`);
                        document.getElementById("usuario").value = "";
                        document.getElementById("descripcion").value = "";
                        pedirComentarios();
                    } else {
                        alert(`El comentario no ha podido almacenarse`)
                    }
                })
                .catch(error => console.log('error', error));
        }
        
        function pintarComentarios(lista){
            let tbody = document.getElementsByTagName("tbody")[0];
            tbody.innerText = "";

            lista.forEach(comentario => {
                let texto = `<tr>
                    <td>${comentario.usuario}</td>
                    <td>${comentario.descripcion}</td>
                </tr>`;
                tbody.innerHTML += texto;                            
            });
        }
        
        function pedirComentarios(){
            var requestOptions = {
                method: 'GET',
                headers: myHeaders,
            };

            fetch("/api/comentarios/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result){
                        pintarComentarios(result);
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Ha habido un error al recuperar los comentarios. Refresque la página")
                });
        }

    </script>
</head>
<body>
    <nav class="navbar is-rounded-custom" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <button class="navbar-burger button" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </button>
        </div>
        <div id="navbarMenu" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="zapatos.html">🏠 Dashboard-Home</a>
                <a class="navbar-item" href="agregar_zapato.html">➕ Agregar Zapato</a>
                <a class="navbar-item" href="ficheros.html?action=upload">📤 Upload Files</a>
                <a class="navbar-item" href="ficheros.html?action=view">👁️ View Files</a>
                <a class="navbar-item" href="comentarios.html">💬 Comments</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <small style="font-size: 0.85rem; color: white; margin-right: 1rem;">
                        👤 Logged as <span id="user-navbar">Cargando...</span>
                    </small>
                </div>
                <div class="navbar-item">
                    <a href="javascript:cerrarSesion()" class="button" style="background-color: #c5213a; color: white;">🔐 LOG OUT</a>
                </div>
                <div class="navbar-item">
                    <a href="registro.html" class="button" style="background-color: #148f6e; color: white;">📝 CREATE ACCOUNT</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-10">
                    <h2 class="title is-2">💬 Comentarios</h2>
                    
                    <!-- Tabla de comentarios -->
                    <div class="comments-table">
                        <h3 class="title is-4">Lista de Comentarios</h3>
                        <table class="table is-striped is-hoverable is-fullwidth">
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>Comentario</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Formulario para agregar comentario -->
                    <div class="comment-form">
                        <h3 class="title is-4">Agregar Nuevo Comentario</h3>
                        <form onsubmit="event.preventDefault(); guardarComentario();">
                            <div class="field">
                                <label class="label" for="usuario">Usuario:</label>
                                <div class="control">
                                    <input required type="text" class="input" placeholder="Tu nombre de usuario" name="usuario" id="usuario">
                                </div>
                            </div>
                            <div class="field">
                                <label class="label" for="descripcion">Comentario:</label>
                                <div class="control">
                                    <textarea required class="textarea" placeholder="Escribe tu comentario aquí..." name="descripcion" id="descripcion"></textarea>
                                </div>
                            </div>
                            <div class="field is-grouped">
                                <div class="control">
                                    <button type="submit" class="button is-success">Guardar Comentario</button>
                                </div>
                                <div class="control">
                                    <a href="zapatos.html" class="button is-primary">Volver al Dashboard</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
