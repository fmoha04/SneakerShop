<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>SneakerShop Login</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="auth-page">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <div class="page-wrapper">
        <div class="content-group">
    

    
            <div class="form-container">
                <ul class="tab-group">
                    <li class="tab active"><a href="#signup">Sign Up</a></li>
                    <li class="tab"><a href="#login">Log In</a></li>
                </ul>
    
                <div class="tab-content">
                    <div id="signup">
                        <h1>Sign Up</h1>
                        <form onsubmit="event.preventDefault(); signup();">
                            <div class="field-wrap" ><input type="text" id="username_sign" placeholder="Username" required /></div>
                            <div class="field-wrap" ><input type="password" id="password_sign" placeholder="Password" required /></div>
                            <button type="submit" class="button button-block">GET STARTED</button>
                        </form>
                    </div>
    
                    <div id="login" style="display:none;">
                        <h1>Welcome Back!</h1>
                        <form onsubmit="event.preventDefault(); conectar();">
                            <div class="field-wrap"><input type="text" id="username" placeholder="Username*" required />
                            </div>
                            <div class="field-wrap"><input type="password" id="password" placeholder="Password*" required />
                            </div>
                            <p class="error" style="display:none;">💀 Usuario o contraseña incorrectos 💀</p>
                            <button type="submit" class="button button-block">LOG IN</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
    // Configuración API
    var myHeaders = new Headers();
    myHeaders.append("Content-Type", "application/json");

        function signup(){
            document.getElementsByClassName("error")[0].style.display="none";


            var raw = JSON.stringify({
                "username": document.getElementById("username_sign").value,
                "password": document.getElementById("password_sign").value,
                "profile": "admin",
            });

            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw
            };

            console.log(raw)

            fetch("/api/usuarios/registro", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status=="OK"){
                        alert("Usuario registrado correctamente");
                    } else {
                        document.getElementsByClassName("error")[0].style.display="block";
                    }
                })
                .catch(error => {
                    console.error('Sign up error', error);
                    alert("Sign up error: " + error)
                }) ;
        }

    function conectar() {
        const errorMsg = document.querySelector("#login .error");
        errorMsg.style.display = "none";

        var usuario = document.getElementById("username").value;
        var raw = JSON.stringify({
            "username": usuario,
            "password": document.getElementById("password").value
        });

        fetch("/api/usuarios/login", { method: 'POST', headers: myHeaders, body: raw })
            .then(response => response.json())
            .then(result => {
                if (result.status == "OK") { 
                    // 1. Guardamos el token CSRF y el perfil de forma segura
                    sessionStorage.setItem("csrf_token", result.csrf_token);
                    sessionStorage.setItem("perfil", result.perfil);
                    // 2. Guardamos el nombre de usuario
                    localStorage.setItem('usuario', usuario);
                    // 3. Redirigimos
                    location.href = "zapatos.html"; 
                } 
                else { 
                    errorMsg.style.display = "block"; 
                }
            })
            .catch(error => {
                console.log('Login error:', error)
                alert("Login error: " + error)
            });
    }

    // Manejo de pestañas
    document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('.tab a');
        const sections = {
            '#signup': document.getElementById('signup'),
            '#login': document.getElementById('login')
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', function (e) {
                e.preventDefault();
                const target = this.getAttribute('href');

                // Actualizar pestañas
                document.querySelectorAll('.tab').forEach(li => li.classList.remove('active'));
                this.parentElement.classList.add('active');

                // Mostrar/Ocultar secciones
                Object.keys(sections).forEach(key => {
                    if (sections[key]) {
                        sections[key].style.display = (key === target) ? 'block' : 'none';
                    }
                });
            });
        });
    });
</script>
</body>
</html>
