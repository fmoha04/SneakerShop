env:
  contexts:
    - name: "AppContext"
      urls:
        - "http://10.227.87.250:6600"
      includePaths:
        - "http://10.227.87.250:6600/.*"
      authentication:
        method: form
        parameters:
          loginPageUrl: "http://10.227.87.250:6600/login"
          loginRequestUrl: "http://10.227.87.250:6600/login"
          loginRequestBody: "username={%username%}&password={%password%}"
      users:
        - name: "usuario1"
          credentials:
            username: "admin"
            password: "1234"
  parameters:
    failOnError: true

jobs:
  - type: spider
    parameters:
      context: "AppContext"
      user: "usuario1"

  - type: activeScan
    parameters:
      context: "AppContext"
      user: "usuario1"

  - type: report
    parameters:
      template: "traditional-html"
      reportFile: "zap-report.html"