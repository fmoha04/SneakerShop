<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="styles.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneakerShop Login</title>
    
    <link rel="stylesheet" href="style.css">

    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        
        function verComentarios() {
            location.href="comentarios.html";
        }

        function conectar() {
            document.getElementsByClassName("error")[0].style.display = "none";
            
            var raw = JSON.stringify({
                "username": document.getElementById("username").value,
                "password": document.getElementById("password").value
            });

            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw
            };

            fetch("/api/usuarios/login", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        location.href = "zapatos.html";
                    } else {
                        document.getElementsByClassName("error")[0].style.display = "block";
                    }
                })
                .catch(error => console.log('error', error));
        }
    </script>
</head>
<body>
    <div class="login-card">
        <h1>Sneaker Shop</h1>
        <div class="error">Usuario o clave incorrecta 💀</div>

        <div class="input-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Usuario">
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña">
        </div>

        <div class="btn-container">
            <button type="button" class="btn-login" onclick="conectar()">ENTRAR</button>
            <button type="button" class="btn-register" onclick="location.href='registro.html'">REGISTRARSE</button>
            <button type="button" class="btn-comments" onclick="verComentarios()">Ver comentarios</button>
        </div>
    </div>
</body>
</html>
