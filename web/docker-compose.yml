services:
  mariadb:
    image: mariadb
    container_name: mariadb-$COMPOSE_PROJECT_NAME
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_USER: agente
      MARIADB_USER_PASSWORD: 0traClave
      MARIADB_DATABASE: ciber
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Zapatos.sql:/docker-entrypoint-initdb.d/Zapatos.sql:ro
    user: mysql
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin-$COMPOSE_PROJECT_NAME
    restart: always
    environment:
      - PMA_HOST=mariadb
    ports:
      - 9093:80
    depends_on:
      - mariadb
  python:
    build: ./api
    container_name: python-$COMPOSE_PROJECT_NAME
    environment:
      DB_USERNAME: root
      DB_PASSWORD: example
      DB_DATABASE: ciber
      DB_HOST: mariadb
      DB_PORT: 3306
      PORT: 8080
      HOST: 0.0.0.0
    depends_on:
      - mariadb
  apache-waf:
    container_name: apache-$COMPOSE_PROJECT_NAME
    build: ./apache #./waf/ en un futuro
    ports:
      - 9090:80
    depends_on:
      - python
    links:
      - python
    # Volumen TEMPORAL, solo para cambios y pruebas en vivo
    # volumes:
    # - ./apache/static/:/var/www/html
volumes:
  mariadb_data:

