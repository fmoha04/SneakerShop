<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP WEB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <link rel="stylesheet" href="main.css">
    <style>
        .oculto {
            display: none;
        }
    </style>
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        onload = function () {
            pedirZapatos();
        }

        function pintarZapatos(lista) {
            let container = document.getElementById("cards-container");
            container.innerHTML = ""; // Limpiamos el contenedor

            lista.forEach(zapato => {
                let card = `
            <div class="shoe-card">
                <div class="card-image">
                    <img src="${zapato.foto}" alt="${zapato.nombre}">
                </div>
                <div class="card-data">
                    <h3>${zapato.nombre}</h3>
                    <p><strong>Marca:</strong> ${zapato.marca}</p>
                    <p class="desc">${zapato.descripcion}</p>
                    <div class="prices">
                        <span>Neto: ${zapato.precio}€</span>
                        <span>IVA: ${zapato.precio_iva}€</span>
                    </div>
                </div>
                <div class="card-actions">
                    <a href="editar_zapato.html?id=${zapato.id}" class="btn-edit">Editar</a>
                    <button onclick="eliminarZapato(${zapato.id})" class="btn-delete">Eliminar</button>
                </div>
            </div>`;
                container.innerHTML += card; // Inyectamos la carta
            });
        }

        function pedirZapatos() {
            var requestOptions = {
                method: 'GET',
                headers: myHeaders,
            };

            fetch("/api/zapatos/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    console.log(result);
                    pintarZapatos(result);
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Ha habido un error al recuperar los zapatos. Refresque la página")
                });
        }
        function eliminarZapato(id) {
            var requestOptions = {
                method: 'DELETE',
                headers: myHeaders,
            };

            fetch("/api/zapatos/" + id, requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        alert("Zapato eliminado")
                        pedirZapatos();
                    } else {
                        alert("El zapato no ha podido ser eliminado")
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Se ha producido un error y el zapato no ha podido ser eliminado")
                });
        }
        function cerrarSesion() {
            var requestOptions = {
                method: 'GET',
                headers: myHeaders
            };
            fetch("/api/usuarios/logout", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        location.href = "index.html";
                    } else {
                        alert("No se ha podido cerrar sesión")
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Se ha producido un error y no se ha podido cerrar sesión")
                });

        }
    </script>
</head>

<body class="admin-page dashboard-view">
    <nav class="navbar is-rounded-custom" role="navigation">
        <div class="navbar-brand">
            <a class="navbar-item brand-logo" href="#">SneakerShop/Home</a>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="ficheros.html">UPLOADS</a>
                <a class="navbar-item" href="#">VIEW CONTENT OF UPLOADS</a>
                <a class="navbar-item" href="comentarios.html">COMMENTS</a>
            </div>
            <div class="navbar-end">
                <a class="navbar-item" href="javascript:cerrarSesion()">SIGN OUT</a>
            </div>
        </div>
    </nav>

    <main class="dashboard-content">
        <header class="welcome-section">
            <h1 class="welcome-text">Welcome <span id="user-display">$(You)</span> to the SneakerShop</h1>
            <a href="agregar_zapato.html" class="button add-custom-btn">Agregar Zapatillas Personalizadas</a>
        </header>

        <section class="inventory-section">
            <h2 class="section-title">Zapatillas Disponibles en el almacén:</h2>
            <div id="cards-container" class="horizontal-scroll-wrapper">
            </div>
        </section>
    </main>
</body>

</html>
