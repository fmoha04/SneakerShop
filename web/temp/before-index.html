<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneakerShop Login</title>
    <link rel="stylesheet" href="main.css">
</head>
<body class="auth-page">
    <div class="page-wrapper">
        <div class="content-group">
    
            <div class="sneaker-container">
                <img src="./assets/zap1-home.png" alt="Sneaker" class="floating-sneaker">
            </div>
    
            <div class="form-container">
                <ul class="tab-group">
                    <li class="tab active"><a href="#signup">Sign Up</a></li>
                    <li class="tab"><a href="#login">Log In</a></li>
                    <li class="tab"><a href="#comments">Comments</a></li>
                </ul>
    
                <div class="tab-content">
                    <div id="signup">
                        <h1>Sign Up</h1>
                        <form action="/" method="post">
                            <div class="top-row">
                                <div class="field-wrap"><input type="text" placeholder="First Name*" required /></div>
                                <div class="field-wrap"><input type="text" placeholder="Last Name*" required /></div>
                            </div>
                            <div class="field-wrap"><input type="email" placeholder="Email Address*" required /></div>
                            <div class="field-wrap"><input type="password" placeholder="Set A Password*" required /></div>
                            <button type="submit" class="button button-block">GET STARTED</button>
                        </form>
                    </div>
    
                    <div id="login" style="display:none;">
                        <h1>Welcome Back!</h1>
                        <form onsubmit="event.preventDefault(); conectar();">
                            <div class="field-wrap"><input type="text" id="username" placeholder="Username*" required />
                            </div>
                            <div class="field-wrap"><input type="password" id="password" placeholder="Password*" required />
                            </div>
                            <p class="error" style="display:none;">💀 Usuario o contraseña incorrectos 💀</p>
                            <button type="submit" class="button button-block">LOG IN</button>
                        </form>
                    </div>
    
                    <div id="comments" style="display:none;">
                        <h1>Leave a Comment</h1>
                        <form action="/" method="post">
                            <div class="field-wrap"><input type="text" placeholder="Your Name*" required /></div>
                            <div class="field-wrap"><textarea placeholder="Write your comment here*" rows="4"
                                    required></textarea></div>
                            <button type="submit" class="button button-block">SEND COMMENT</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
    // Configuración API
    var myHeaders = new Headers();
    myHeaders.append("Content-Type", "application/json");

    function conectar() {
        const errorMsg = document.querySelector("#login .error");
        errorMsg.style.display = "none";

        var raw = JSON.stringify({
            "username": document.getElementById("username").value,
            "password": document.getElementById("password").value
        });

        fetch("/api/usuarios/login", { method: 'POST', headers: myHeaders, body: raw })
            .then(response => response.json())
            .then(result => {
                if (result.status == "OK") { location.href = "zapatos.html"; } 
                else { errorMsg.style.display = "block"; }
            })
            .catch(error => console.log('error', error));
    }

    // Manejo de pestañas
    document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('.tab a');
        const sections = {
            '#signup': document.getElementById('signup'),
            '#login': document.getElementById('login'),
            '#comments': document.getElementById('comments')
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', function (e) {
                e.preventDefault();
                const target = this.getAttribute('href');

                // Actualizar pestañas
                document.querySelectorAll('.tab').forEach(li => li.classList.remove('active'));
                this.parentElement.classList.add('active');

                // Mostrar/Ocultar secciones
                Object.keys(sections).forEach(key => {
                    if (sections[key]) {
                        sections[key].style.display = (key === target) ? 'block' : 'none';
                    }
                });
            });
        });
    });
</script>
</body>
</html>
