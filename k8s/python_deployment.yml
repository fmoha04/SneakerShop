apiVersion: apps/v1
kind: Deployment
metadata:
  name: python
  namespace: grupo7a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python
  template:
    metadata:
      labels:
        app: python
    spec:
      containers:
        - name: python
#          image: zoltar238/kubepython:1.0
          image: fmoha21/pps-python:${FINAL_IMAGE_TAG_PYTHON}
#          image: fmoha21/pps-python:latest  # Update with specific tag when pushing to registry
          ports:
            - containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grupo7a-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grupo7a-secret
                  key: DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: grupo7a-secret
                  key: DB_DATABASE
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: "3306"
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grupo7a-secret
                  key: SECRET_KEY
            - name: WTF_CSRF_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grupo7a-secret
                  key: WTF_CSRF_SECRET_KEY
            - name: PEPPER_KEY
              valueFrom:
                secretKeyRef:
                  name: grupo7a-secret
                  key: PEPPER_KEY
          livenessProbe:
            httpGet:
              path: /api/usuarios/
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/usuarios/
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
