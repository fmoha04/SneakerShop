apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: grupo7a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache
          image: fmoha21/pps-apache:${FINAL_IMAGE_TAG_WAF}
#          image: fmoha21/pps-apache:latest  # Update with specific tag when pushing to registry
          ports:
            - containerPort: 443
          volumeMounts:
            - name: certs
              mountPath: /usr/local/apache2/certs
              readOnly: true
            - name: apache-logs
              mountPath: /usr/local/apache2/logs
          livenessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: certs
          secret:
            secretName: grupo7a-certs
            items:
              - key: cert.pem
                path: cert.pem
              - key: key.pem
                path: key.pem
        - name: apache-logs
          emptyDir: {}

